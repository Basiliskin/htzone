# Local development: `docker compose up -d`, then http://localhost:8080
services:
  app:
    build:
      context: .
      target: dev
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    environment:
      APP_ENV: dev
      DB_PATH: /app/var/catalog.sqlite
      LOG_LEVEL: debug
      # Step debugging (D27): XDEBUG_MODE=debug docker compose up -d
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
    extra_hosts:
      - "host.docker.internal:host-gateway"
