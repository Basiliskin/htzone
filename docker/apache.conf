# Request size limits (server level: Apache reads the request line before it picks a virtual host).
# A query is at most 100 characters (AC-4.2); even all-Hebrew that is ~600 bytes once URL-encoded,
# so 2 KB is generous. Longer request lines get our JSON error shape instead of Apache's HTML page.
LimitRequestLine 2048
ErrorDocument 414 /errors/414.json

# Virtual host for /app/public. Security headers here cover static files and Apache's own errors;
# PHP responses get the same values from Http\Kernel, so Apache skips index.php to avoid sending them twice.
<VirtualHost *:${PORT}>
    DocumentRoot /app/public
    <Directory /app/public>
        Options -Indexes -MultiViews +FollowSymLinks
        AllowOverride None
        Require all granted
        # Front controller: anything that isn't a real file goes to index.php; a missing asset stays a 404
        RewriteEngine On
        RewriteCond %{REQUEST_URI} !^/assets/
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [QSA,L]
    </Directory>
    # Never serve dotfiles (.htaccess, .env …)
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    <If "%{REQUEST_FILENAME} !~ m#/index\.php$#">
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
        Header always set Strict-Transport-Security "max-age=31536000"
        Header always set Content-Security-Policy "default-src 'self'; img-src 'self' https://placehold.co data:; style-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'"
    </If>

    # Fonts and images never change in place: cache a week. JS/CSS keep their names (no build step, no
    # hashed filenames), so the browser revalidates them (ETag → 304) and a deploy is seen at once.
    <LocationMatch "^/assets/">
        Header set Cache-Control "public, max-age=604800"
    </LocationMatch>
    <LocationMatch "^/assets/.+\.(js|css)$">
        Header set Cache-Control "no-cache"
    </LocationMatch>
    # Error bodies (public/errors/) are JSON like the API's and never cached, like the PHP error responses
    AddType "application/json; charset=utf-8" .json
    <LocationMatch "^/errors/">
        Header always set Cache-Control "no-store"
    </LocationMatch>

    # Logs to the container's stdout/stderr (the base image links these files there)
    ErrorLog ${APACHE_LOG_DIR}/error.log
    LogLevel warn
</VirtualHost>
